name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cm_test
      DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/cm_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cm_test
      SECRET_KEY: ci-only-secret-key-not-for-production-0000000000000000000000000000
      GEMINI_API_KEY: dummy_ci_key
      ANTHROPIC_API_KEY: dummy_ci_key
      OPENAI_API_KEY: dummy_ci_key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Apply database migrations
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build